# Packaging of Litebee IDE as one portable Windows file: double-click, nothing to install.
# Build locally: npm run dist (from the desktop folder). The release workflow uses this same file.
appId: org.litebee.ide
productName: Litebee IDE
directories:
  output: release
files:
  - out/**
  - package.json
asar: true
electronLanguages: [en-US, ru]
win:
  target: portable
  signAndEditExecutable: false
portable:
  artifactName: Litebee-IDE-${version}.exe
