name: Release (Windows .exe)

# A tag like v0.1.0 builds a single-file portable Litebee-IDE-<version>.exe and attaches it to a GitHub release.
# "Run workflow" builds the same file without a release and keeps it as an artifact for 14 days.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      # tests compare text with LF line endings: do not let git turn them into CRLF on the Windows runner
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package portable exe
        run: npx --yes electron-builder@26 --win portable --config electron-builder.yml
      - uses: actions/upload-artifact@v4
        with:
          name: Litebee-IDE-windows
          path: desktop/release/*.exe
          retention-days: 14
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/*.exe
          generate_release_notes: true
